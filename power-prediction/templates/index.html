
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Power Output Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>⚡ Power Output Prediction</h1>

        <p class="subtitle">
            Predict electrical power output using machine learning
        </p>

        <div class="form">

            <label>Ambient Temperature (°C)</label>
            <input
                type="number"
                id="AT"
                step="0.01"
                placeholder="Example: 20.5"
            >

            <label>Exhaust Vacuum (cm Hg)</label>
            <input
                type="number"
                id="V"
                step="0.01"
                placeholder="Example: 60.2"
            >

            <label>Ambient Pressure (mbar)</label>
            <input
                type="number"
                id="AP"
                step="0.01"
                placeholder="Example: 1015"
            >

            <label>Relative Humidity (%)</label>
            <input
                type="number"
                id="RH"
                step="0.01"
                placeholder="Example: 70"
            >

            <button onclick="predictPower()">
                Predict Power Output
            </button>

        </div>

        <div id="result" class="result">
            <h2>Predicted Output</h2>
            <p id="prediction">-- MW</p>
        </div>

    </div>


    <script>

        async function predictPower() {

            const AT = document.getElementById("AT").value;
            const V = document.getElementById("V").value;
            const AP = document.getElementById("AP").value;
            const RH = document.getElementById("RH").value;

            if (!AT || !V || !AP || !RH) {
                alert("Please enter all values.");
                return;
            }

            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        AT: AT,
                        V: V,
                        AP: AP,
                        RH: RH
                    })

                });

                const data = await response.json();

                document.getElementById("prediction").innerText =
                    data.prediction + " MW";

            }

            catch (error) {

                console.error(error);

                document.getElementById("prediction").innerText =
                    "Prediction failed";

            }

        }

    </script>

</body>

</html>
